<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мандориновая любовь</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom right, #FFA07A, #FF6347);
    color: #fff;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 30px 10px;
    font-size: 2.2em;
    font-weight: bold;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.4);
  }

  .cover {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    animation: fadeIn 2s ease-in;
  }

  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 15px;
    padding: 20px 10px;
  }

  .carousel img {
    flex: 0 0 auto;
    width: 80%;
    max-width: 300px;
    border-radius: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    scroll-snap-align: center;
    transition: transform 0.3s, box-shadow 0.5s;
    opacity: 0;
    animation: fadeIn 1s forwards;
  }

  .carousel img:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255,165,0,0.5);
  }

  .carousel img:nth-child(1) { animation-delay: 0.2s; }
  .carousel img:nth-child(2) { animation-delay: 0.4s; }
  .carousel img:nth-child(3) { animation-delay: 0.6s; }

  @keyframes fadeIn { to { opacity: 1; } }
  .carousel::-webkit-scrollbar { display: none; }

  @media (max-width: 600px) {
    .carousel img { width: 90%; }
  }

  footer {
    text-align: center;
    padding: 15px;
    font-size: 0.9em;
    opacity: 0.8;
  }
</style>
</head>
<body>

<header>Мандориновая любовь</header>

<img src="images/cover.jpg" alt="Обложка" class="cover">

<div class="carousel">
  <img src="images/photo1.jpg" alt="Фото 1">
  <img src="images/photo2.jpg" alt="Фото 2">
  <img src="images/photo3.jpg" alt="Фото 3">
</div>

<footer>© 2025 Мандориновая любовь</footer>

</body>
</html>
