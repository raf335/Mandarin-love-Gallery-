<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мандориновая любовь</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom right, #FFA07A, #FF6347);
    color: #fff;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 30px 10px;
    font-size: 2.2em;
    font-weight: bold;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.4);
  }

  .cover {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-bottom-left-radius: 20px;
    border-bottom-right-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    animation: fadeIn 2s ease-in;
  }

  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 15px;
    padding: 20px 10px;
    transition: filter 0.3s;
  }

  .carousel-item {
    position: relative;
    flex: 0 0 auto;
    width: 80%;
    max-width: 300px;
    aspect-ratio: 4/3;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    scroll-snap-align: center;
    transition: transform 0.3s, box-shadow 0.5s;
  }

  .carousel-item:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(255,165,0,0.5);
  }

  .carousel-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Модальное окно для цитаты */
  .modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    padding: 20px;
    z-index: 100;
    flex-direction: column;
    position: fixed;
  }

  .modal.active {
    opacity: 1;
    pointer-events: all;
  }

  .modal span {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    font-size: 1.3em;
    line-height: 1.5;
  }

  /* Навигация */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2em;
    color: #fff;
    cursor: pointer;
    user-select: none;
    padding: 10px;
  }
  .nav-left { left: 10px; }
  .nav-right { right: 10px; }

  footer {
    text-align: center;
    padding: 15px;
    font-size: 0.9em;
    opacity: 0.8;
  }

  @media (max-width: 600px) {
    .carousel-item { width: 90%; }
    .modal span { font-size: 1.1em; }
    .nav-arrow { font-size: 1.5em; }
  }

  @keyframes floatIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>

<header>Мандориновая любовь</header>

<img src="images/cover.jpg" alt="Обложка" class="cover">

<div class="carousel">

<!-- Модальное окно для цитаты -->
<div class="modal" id="modal">
  <div class="nav-arrow nav-left" id="prev">&#8592;</div>
  <div class="nav-arrow nav-right" id="next">&#8594;</div>
</div>

<footer>© 2025 Мандориновая любовь</footer>

<script>
const quotesText = [
"Она пахла мандаринами и утренним солнцем.",
"Каждое утро начиналось с её улыбки.",
"Любовь — это не чувство, это привычка быть рядом.",
"С каждым взглядом мир становился ярче.",
"Наши разговоры были как сладкий сок мандарина.",
"Её смех звучал, как летнее солнце.",
"В её глазах отражались все мои мечты.",
"Даже тишина между нами была наполнена теплом.",
"Мы держались за руки, словно берегли целый мир.",
"Её присутствие делало серые дни золотыми.",
"Каждый наш вечер пахнул апельсинами и дождём.",
"Любовь — это когда вместе даже молчать приятно.",
"Она была моим солнечным лучом в пасмурный день.",
"Мы гуляли по улицам, как герои собственного фильма.",
"Её прикосновение оставляло шрамы счастья на сердце.",
"Даже дождь казался ласковым, когда она рядом.",
"Мы создавали маленькие ритуалы, которые никто не понимал.",
"Её голос был как мелодия, которую я не хотел забывать.",
"Каждый день с ней был как кусочек мандаринового неба.",
"Она умела превращать обыденность в магию.",
"Я терял счёт времени, когда смотрел на неё.",
"Наши шёпоты были тёплыми, как домашний плед.",
"Её смех лечил мои самые старые раны.",
"Вместе мы создавали свои маленькие праздники.",
"Она была ароматом счастья, который невозможно забыть.",
"Мы знали друг друга лучше, чем мир сам себя.",
"Каждое слово от неё было как подарок.",
"Её присутствие делало обычные вещи волшебными.",
"Мы умели находить счастье в самых маленьких моментах.",
"Любовь с ней была как вечный закат — яркая и теплая."
];

const items = document.querySelectorAll('.carousel-item');
const modal = document.getElementById('modal');
const carousel = document.querySelector('.carousel');

let currentIndex = 0;

function showModal(index){
  currentIndex = index;
  modal.innerHTML = `<div class="nav-arrow nav-left" id="prev">&#8592;</div>
                     <div class="nav-arrow nav-right" id="next">&#8594;</div>` +
                     quotesText[index].split(' ').map((w,i)=>`<span style="animation-delay:${i*0.08}s">${w}</span>`).join(' ');
  modal.classList.add('active');
  carousel.style.filter = 'blur(2px) brightness(0.6)';

  document.getElementById('prev').onclick = (e)=>{e.stopPropagation(); prevQuote();};
  document.getElementById('next').onclick = (e)=>{e.stopPropagation(); nextQuote();};
}

function prevQuote(){
  currentIndex = (currentIndex-1+quotesText.length)%quotesText.length;
  showModal(currentIndex);
}

function nextQuote(){
  currentIndex = (currentIndex+1)%quotesText.length;
  showModal(currentIndex);
}

items.forEach((item,index)=>{
  item.addEventListener('click',()=>{ showModal(index); });
});

modal.addEventListener('click', ()=>{
  modal.classList.remove('active');
  carousel.style.filter = 'none';
});
</script>

</body>
</html>
