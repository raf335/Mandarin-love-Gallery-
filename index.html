<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мандориновая любовь</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
body {
  margin:0;
  font-family:Arial,sans-serif;
  background: linear-gradient(to bottom right, #FFA07A, #FF6347);
  color:#fff;
  overflow-x:hidden;
  transition: background 0.5s;
}
body.dark {
  background: linear-gradient(to bottom right, #2c2c2c, #111);
  color:#fff;
}
header{
  text-align:center;
  padding:30px 10px;
  font-size:2.2em;
  font-weight:bold;
  text-shadow:1px 1px 5px rgba(0,0,0,0.4);
}
.cover{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  animation:fadeIn 2s ease-in;
}
.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:15px;
  padding:20px 10px;
  scroll-behavior: smooth;
  transition: filter 0.3s;
}
.carousel-item{
  position:relative;
  flex:0 0 auto;
  width:80%;
  max-width:300px;
  aspect-ratio:4/3;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  scroll-snap-align:center;
  transition: transform 0.5s, box-shadow 0.5s, opacity 0.5s;
  opacity:0;
  transform:translateY(50px);
}
.carousel-item.visible{
  opacity:1;
  transform:translateY(0);
}
.carousel-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.carousel-item .caption{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  background:rgba(0,0,0,0.4);
  padding:5px;
  font-size:0.9em;
  opacity:0;
  transition: opacity 0.3s;
}
.carousel-item:hover .caption{
  opacity:1;
}

/* Мини-карта точек */
.carousel-indicators{
  text-align:center;
  margin:10px 0;
}
.carousel-indicators .dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:rgba(255,255,255,0.5);
  border-radius:50%;
  margin:0 5px;
  cursor:pointer;
  transition: background 0.3s, transform 0.3s;
}
.carousel-indicators .dot.active{
  background:#FFD700;
  transform:scale(1.3);
}

/* Модальное окно */
.modal{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.85);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s;
  padding:20px;
  z-index:100;
  flex-direction:column;
  backdrop-filter:blur(5px);
}
.modal.active{
  opacity:1;
  pointer-events:all;
}
.quote-container{
  max-width:80%;
}
.quote-word{
  display:inline-block;
  opacity:0;
  transform:translateY(20px);
  font-family: 'Pacifico', cursive;
  font-size:1.3em;
  line-height:1.5;
  animation:floatIn 0.5s forwards;
}
.quote-word:hover{
  transform: translateY(-5px) scale(1.05);
  text-shadow: 1px 1px 3px rgba(255,200,100,0.7);
}
.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:2em;
  color:#fff;
  cursor:pointer;
  user-select:none;
  padding:10px;
}
.nav-left{ left:10px;}
.nav-right{ right:10px; }

footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  opacity:0.8;
}
.theme-toggle{
  position:fixed;
  top:10px;
  right:10px;
  background:#fff;
  color:#000;
  border:none;
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
  z-index:200;
}
@media (max-width:600px){
  .carousel-item{ width:90%; }
  .quote-word{ font-size:1.1em; }
  .nav-arrow{ font-size:1.5em; }
}
@keyframes floatIn{
  to{opacity:1; transform:translateY(0);}
}
@keyframes fadeIn{ to{opacity:1;} }
</style>
</head>
<body>

<button class="theme-toggle">🌙/☀️</button>
<header>Мандориновая любовь</header>

<img src="images/cover.jpg" alt="Обложка" class="cover">

<div class="carousel" id="carousel">
  <!-- 30 фото с подписью -->
  <!-- Пример первых 3, остальные аналогично: photo4.jpg ... photo30.jpg -->
  <div class="carousel-item"><img src="images/photo1.jpg"><div class="caption">Фото 1: начало истории</div></div>
  <div class="carousel-item"><img src="images/photo2.jpg"><div class="caption">Фото 2: первые встречи</div></div>
  <div class="carousel-item"><img src="images/photo3.jpg"><div class="caption">Фото 3: улыбки</div></div>
  <!-- ... до photo30.jpg ... -->
</div>

<div class="carousel-indicators" id="carousel-indicators"></div>

<div class="modal" id="modal">
  <div class="nav-arrow nav-left" id="prev">&#8592;</div>
  <div class="nav-arrow nav-right" id="next">&#8594;</div>
  <div class="quote-container"></div>
</div>

<footer>© 2025 Мандориновая любовь</footer>
<audio id="tick" src="tick.mp3"></audio>

<script>
const quotesText=[
"Она пахла мандаринами и утренним солнцем.",
"Каждое утро начиналось с её улыбки.",
"Любовь — это не чувство, это привычка быть рядом.",
"С каждым взглядом мир становился ярче.",
"Наши разговоры были как сладкий сок мандарина.",
"Её смех звучал, как летнее солнце.",
"В её глазах отражались все мои мечты.",
"Даже тишина между нами была наполнена теплом.",
"Мы держались за руки, словно берегли целый мир.",
"Её присутствие делало серые дни золотыми.",
"Каждый наш вечер пахнул апельсинами и дождём.",
"Любовь — это когда вместе даже молчать приятно.",
"Она была моим солнечным лучом в пасмурный день.",
"Мы гуляли по улицам, как герои собственного фильма.",
"Её прикосновение оставляло шрамы счастья на сердце.",
"Даже дождь казался ласковым, когда она рядом.",
"Мы создавали маленькие ритуалы, которые никто не понимал.",
"Её голос был как мелодия, которую я не хотел забывать.",
"Каждый день с ней был как кусочек мандаринового неба.",
"Она умела превращать обыденность в магию.",
"Я терял счёт времени, когда смотрел на неё.",
"Наши шёпоты были тёплыми, как домашний плед.",
"Её смех лечил мои самые старые раны.",
"Вместе мы создавали свои маленькие праздники.",
"Она была ароматом счастья, который невозможно забыть.",
"Мы знали друг друга лучше, чем мир сам себя.",
"Каждое слово от неё было как подарок.",
"Её присутствие делало обычные вещи волшебными.",
"Мы умели находить счастье в самых маленьких моментах.",
"Любовь с ней была как вечный закат — яркая и теплая."
];

const items=document.querySelectorAll('.carousel-item');
const modal=document.getElementById('modal');
const carousel=document.getElementById('carousel');
const quoteContainer=modal.querySelector('.quote-container');
const tick=document.getElementById('tick');
const indicatorsContainer=document.getElementById('carousel-indicators');
let currentIndex=0;

// создаём точки мини-карты
items.forEach((item,index)=>{
  const dot = document.createElement('span');
  dot.classList.add('dot');
  if(index===0) dot.classList.add('active');
  dot.addEventListener('click', ()=>{
    showModal(index);
    scrollToItem(index);
  });
  indicatorsContainer.appendChild(dot);
});

function updateDots(){
  const dots = indicatorsContainer.querySelectorAll('.dot');
  dots.forEach((dot,i)=>{
    dot.classList.toggle('active', i===currentIndex);
  });
}

function scrollToItem(index){
  items[index].scrollIntoView({behavior:'smooth', inline:'center'});
}

function showModal(index){
  currentIndex=index;
  quoteContainer.innerHTML='';
  quotesText[index].split(' ').forEach((word,i)=>{
    const span=document.createElement('span');
    span.style.animationDelay=`${i*0.08}s`;
    span.textContent = word;
    span.classList.add('quote-word');
    quoteContainer.appendChild(span);
    quoteContainer.appendChild(document.createTextNode(' '));
  });
  modal.classList.add('active');
  carousel.style.filter='blur(2px) brightness(0.6)';
  tick.currentTime=0;
  tick.play();
  updateDots();
}

function prevQuote(){ currentIndex=(currentIndex-1+quotesText.length)%quotesText.length; showModal(currentIndex);}
function nextQuote(){ currentIndex=(currentIndex+1)%quotesText.length; showModal(currentIndex);}

items.forEach((item,index)=>{ item.addEventListener('click',()=>{ showModal(index); }); });
modal.addEventListener('click',(e)=>{ if(e.target===modal){ modal.classList.remove('active'); carousel.style.filter='none'; }});
document.getElementById('prev').addEventListener('click',(e)=>{e.stopPropagation(); prevQuote();});
document.getElementById('next').addEventListener('click',(e)=>{e.stopPropagation(); nextQuote();});

// Parallax и анимация фото
function reveal(){
  const bottom=window.innerHeight;
  items.forEach(item=>{
    const rect=item.getBoundingClientRect();
    if(rect.top<bottom-50){
      item.classList.add('visible');
      item.style.transform=`translateY(${rect.top*0.05}px)`;
    }
  });
}
window.addEventListener('scroll',reveal);
reveal();

// Темная/светлая тема
document.querySelector('.theme-toggle').addEventListener('click',()=>{ document.body.classList.toggle('dark'); });

// Свайп для мобильных
let startX=0;
modal.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; });
modal.addEventListener('touchend',e=>{
  let diff=e.changedTouches[0].clientX-startX;
  if(diff>50) prevQuote();
  if(diff<-50) nextQuote();
});
</script>

</body>
</html>
