<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мандориновая любовь</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:'Roboto Slab', serif;
  background: linear-gradient(to bottom right, #FFA07A, #FF6347);
  color:#fff;
  overflow-x:hidden;
  transition:background 0.5s;
}
body.dark{
  background: linear-gradient(to bottom right,#2c2c2c,#111);
}
header{
  text-align:center;
  padding:30px 10px;
  font-size:2.4em;
  font-weight:bold;
  text-shadow:1px 1px 6px rgba(0,0,0,0.4);
}
.cover{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-bottom-left-radius:20px;
  border-bottom-right-radius:20px;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  animation:fadeIn 2s ease-in;
}
.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:20px;
  padding:20px 10px;
  scroll-behavior:smooth;
  transition:filter 0.3s;
}
.carousel-item{
  position:relative;
  flex:0 0 auto;
  width:80%;
  max-width:300px;
  aspect-ratio:4/3;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  scroll-snap-align:center;
  transition:transform 0.5s,opacity 0.5s,filter 0.5s;
}
.carousel-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.3s, box-shadow 0.5s;
}
.carousel-item:hover img{
  transform:scale(1.05);
  box-shadow:0 10px 25px rgba(255,165,0,0.6),0 0 20px rgba(255,165,0,0.5);
}

/* Мини-карта точек */
.carousel-indicators{
  text-align:center;
  margin:10px 0;
  overflow-x:auto;
  white-space:nowrap;
}
.carousel-indicators .dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:rgba(255,255,255,0.5);
  border-radius:50%;
  margin:0 3px;
  cursor:pointer;
  transition:background 0.3s, transform 0.3s;
}
.carousel-indicators .dot.active{
  background:linear-gradient(45deg,#FFD700,#FFA500);
  transform:scale(1.4);
}

/* Модальное окно */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background: radial-gradient(circle, rgba(255,165,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s;
  padding:20px;
  z-index:100;
  flex-direction:column;
  backdrop-filter:blur(6px);
}
.modal.active{
  opacity:1;
  pointer-events:all;
}
.modal img{
  max-width:90%;
  max-height:60%;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 6px 25px rgba(0,0,0,0.5);
  object-fit:cover;
  transform:scale(0.8);
  opacity:0;
  animation:photoPop 0.5s forwards;
}
.quote-container{
  max-width:80%;
  font-family:'Pacifico', cursive;
  font-size:1.3em;
  line-height:1.8;
  text-shadow:1px 1px 2px rgba(0,0,0,0.4);
}
.quote-word{
  display:inline-block;
  opacity:0;
  transform:translateY(20px) scale(0.8);
  animation:floatIn 0.5s forwards;
  margin-right:10px;
  letter-spacing:1px;
}
.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:2em;
  color:#fff;
  cursor:pointer;
  user-select:none;
  padding:10px;
}
.nav-left{ left:10px;}
.nav-right{ right:10px; }

footer{
  text-align:center;
  padding:15px;
  font-size:0.9em;
  opacity:0.8;
}
.theme-toggle{
  position:fixed;
  top:10px;
  right:10px;
  background:#fff;
  color:#000;
  border:none;
  padding:5px 10px;
  border-radius:5px;
  cursor:pointer;
  z-index:200;
}
@media(max-width:600px){
  .carousel-item{ width:90%; }
  .quote-container{ font-size:1.1em; max-width:90%; }
  .nav-arrow{ font-size:1.5em; }
}
@keyframes floatIn{ to{opacity:1; transform:translateY(0) scale(1);} }
@keyframes fadeIn{ to{opacity:1;} }
@keyframes photoPop{
  0%{transform:scale(0.8);opacity:0;}
  100%{transform:scale(1);opacity:1;}
}
</style>
</head>
<body>

<button class="theme-toggle">🌙/☀️</button>
<header>Мандориновая любовь</header>
<img src="images/cover.jpg" alt="Обложка" class="cover">

<div class="carousel" id="carousel">
  <!-- 30 фото -->
  <div class="carousel-item"><img src="images/photo1.jpg"></div>
  <div class="carousel-item"><img src="images/photo2.jpg"></div>
  <div class="carousel-item"><img src="images/photo3.jpg"></div>
  <div class="carousel-item"><img src="images/photo4.jpg"></div>
  <div class="carousel-item"><img src="images/photo5.jpg"></div>
  <div class="carousel-item"><img src="images/photo6.jpg"></div>
  <div class="carousel-item"><img src="images/photo7.jpg"></div>
  <div class="carousel-item"><img src="images/photo8.jpg"></div>
  <div class="carousel-item"><img src="images/photo9.jpg"></div>
  <div class="carousel-item"><img src="images/photo10.jpg"></div>
  <div class="carousel-item"><img src="images/photo11.jpg"></div>
  <div class="carousel-item"><img src="images/photo12.jpg"></div>
  <div class="carousel-item"><img src="images/photo13.jpg"></div>
  <div class="carousel-item"><img src="images/photo14.jpg"></div>
  <div class="carousel-item"><img src="images/photo15.jpg"></div>
  <div class="carousel-item"><img src="images/photo16.jpg"></div>
  <div class="carousel-item"><img src="images/photo17.jpg"></div>
  <div class="carousel-item"><img src="images/photo18.jpg"></div>
  <div class="carousel-item"><img src="images/photo19.jpg"></div>
  <div class="carousel-item"><img src="images/photo20.jpg"></div>
  <div class="carousel-item"><img src="images/photo21.jpg"></div>
  <div class="carousel-item"><img src="images/photo22.jpg"></div>
  <div class="carousel-item"><img src="images/photo23.jpg"></div>
  <div class="carousel-item"><img src="images/photo24.jpg"></div>
  <div class="carousel-item"><img src="images/photo25.jpg"></div>
  <div class="carousel-item"><img src="images/photo26.jpg"></div>
  <div class="carousel-item"><img src="images/photo27.jpg"></div>
  <div class="carousel-item"><img src="images/photo28.jpg"></div>
  <div class="carousel-item"><img src="images/photo29.jpg"></div>
  <div class="carousel-item"><img src="images/photo30.jpg"></div>
</div>

<div class="carousel-indicators" id="carousel-indicators"></div>

<div class="modal" id="modal">
  <div class="nav-arrow nav-left" id="prev">&#8592;</div>
  <div class="nav-arrow nav-right" id="next">&#8594;</div>
  <img id="modal-photo" src="" alt="Фото цитаты">
  <div class="quote-container"></div>
</div>

<footer>© 2025 Мандориновая любовь</footer>
<audio id="tick" src="tick.mp3"></audio>

<script>
const quotesText=[
"Начало истории. С первых взглядов всё казалось особенным.",
"Первые встречи заставили сердце биться быстрее.",
"Улыбки, которые согревали души.",
"Прогулка под солнцем, полная света.",
"Вечер, когда мы делились мечтами.",
"Смех, который звучал как музыка.",
"Разговоры, в которых раскрывались сердца.",
"Дождь и мы, смеясь под каплями.",
"Солнце в наших руках и в глазах.",
"Закат, который запомнился навсегда.",
"Прогулка вечером под фонарями.",
"Кофе и теплые слова.",
"Смех под дождем словно магия.",
"Совместные планы и надежды.",
"Вечерние огни, отражение счастья.",
"Шепот на улице под светом фонарей.",
"Маленькие радости повседневности.",
"Смех до слёз, незабываемый.",
"Прогулка ночью, полная тайн.",
"Мандариновый закат в наших сердцах.",
"Уютные моменты вместе.",
"Смех и радость, что не кончаются.",
"Прогулка вдвоём, рука в руке.",
"Вечерние огни города создавали магию.",
"Разговоры о мечтах и планах.",
"Улыбки и счастье в каждом мгновении.",
"Дождливый день с теплым теплом.",
"Вечерние мысли и тихие разговоры.",
"Прогулка у моря, где мечты сбываются.",
"Счастливый финал истории о нас."
];

const items=document.querySelectorAll('.carousel-item');
const modal=document.getElementById('modal');
const carousel=document.getElementById('carousel');
const quoteContainer=modal.querySelector('.quote-container');
const modalPhoto=document.getElementById('modal-photo');
const tick=document.getElementById('tick');
const indicatorsContainer=document.getElementById('carousel-indicators');
let currentIndex=0;

// --- Инициализация точек ---
items.forEach((item,index)=>{
  const dot=document.createElement('span');
  dot.classList.add('dot');
  if(index===0) dot.classList.add('active');
  dot.addEventListener('click',()=>{ showModal(index); scrollToItem(index); });
  indicatorsContainer.appendChild(dot);
});

function updateDots(){
  const dots = indicatorsContainer.querySelectorAll('.dot');
  dots.forEach((dot,i)=>{ dot.classList.toggle('active',i===currentIndex); });
}

function scrollToItem(index){ items[index].scrollIntoView({behavior:'smooth', inline:'center'}); }

// --- Показ модалки с плавной анимацией ---
function showModal(index){
  currentIndex=index;
  modalPhoto.style.animation='none';
  void modalPhoto.offsetWidth;
  modalPhoto.src=items[index].querySelector('img').src;
  modalPhoto.style.animation='photoPop 0.5s forwards';

  quoteContainer.innerHTML='';
  quotesText[index].split(' ').forEach((word,i)=>{
    const span=document.createElement('span');
    span.style.animationDelay=`${i*0.06}s`;
    span.textContent=word;
    span.classList.add('quote-word');
    quoteContainer.appendChild(span);
  });

  modal.classList.add('active');
  carousel.style.filter='blur(2px) brightness(0.6)';
  tick.currentTime=0;
  tick.play();
  updateDots();
}

function prevQuote(){ currentIndex=(currentIndex-1+quotesText.length)%quotesText.length; showModal(currentIndex);}
function nextQuote(){ currentIndex=(currentIndex+1)%quotesText.length; showModal(currentIndex);}

// Клик по фото открывает модалку
items.forEach((item,index)=>{ item.addEventListener('click',()=>{ showModal(index); }); });

// Закрытие модалки при клике по фону
modal.addEventListener('click',(e)=>{ if(e.target===modal){ modal.classList.remove('active'); carousel.style.filter='none'; }});
document.getElementById('prev').addEventListener('click',(e)=>{ e.stopPropagation(); prevQuote(); });
document.getElementById('next').addEventListener('click',(e)=>{ e.stopPropagation(); nextQuote(); });

// Анимация появления фото при скролле
function reveal(){
  const bottom=window.innerHeight;
  items.forEach(item=>{
    const rect=item.getBoundingClientRect();
    if(rect.top<bottom-50){ item.classList.add('visible'); }
  });
}
window.addEventListener('scroll',reveal); reveal();

// Темная/светлая тема
document.querySelector('.theme-toggle').addEventListener('click',()=>{ document.body.classList.toggle('dark'); });

// --- Swipe ---
let startX=0;
modal.addEventListener('touchstart',e=>{ startX=e.touches[0].clientX; });
modal.addEventListener('touchend',e=>{
  let diff=e.changedTouches[0].clientX-startX;
  if(diff>50) prevQuote();
  if(diff<-50) nextQuote();
});
</script>

</body>
</html>
